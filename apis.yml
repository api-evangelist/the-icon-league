aid: the-icon-league
name: The Icon League
description: >-
  The Icon League is a five-a-side (small-sided) football entertainment league co-founded by
  former Real Madrid and Germany midfielder Toni Kroos and German streamer Elias Nerlich (Eliasn97),
  operated by The Icon League GmbH of Cologne, Germany (Amtsgericht Köln, HRB 117138). Played indoors
  in a US-style 14-team franchise format with two 12-minute halves and "Rulebreaker" mechanics designed
  to maximize attacking play, the league blends professional and amateur players and is distributed
  primarily through livestreams and social platforms to a young German-speaking audience. Season one
  generated more than 1.3 billion social-media impressions, and the league raised a €15M Series A
  (backed by HV Capital) to professionalize operations and expand across Europe. This is a consumer
  sports-and-media property; it publishes a public content website (teams, players, standings, matchdays,
  news, tickets, shop) but exposes no public developer API surface.
